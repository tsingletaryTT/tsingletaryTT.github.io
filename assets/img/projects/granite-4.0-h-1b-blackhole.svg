<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 241" width="596" height="241" role="img" aria-label="From the model card, on one Blackhole p300c chip with tt-metal v0.80.0: about 34 tokens per second traced decode, 0.32 seconds to the first token after a short prompt, 123, 406 and 651 tokens per second prefill for prompts of 128, 512 and 1,024 tokens, and top-1 agreement with the fp32 CPU reference of 0.979 on four short prompts.">
<rect x="0.5" y="0.5" width="595" height="240" rx="6" fill="#111318" stroke="#232730"/>
<circle cx="28" cy="24" r="4" fill="#4FD1C5"/>
<text x="42" y="28" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#607D8B">episod/granite-4.0-h-1b-blackhole — numbers (from the model card)</text>
<line x1="0" y1="36" x2="596" y2="36" stroke="#232730"/>
<text y="59" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#607D8B">$</tspan><tspan x="31.83" fill="#4FD1C5"> tt-model serve episod/granite-4.0-h-1b-blackhole</tspan></text>
<text y="91" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#607D8B">one Blackhole p300c chip, tt-metal v0.80.0</tspan></text>
<text y="107" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">traced decode                                           </tspan><tspan x="462.40" fill="#4FD1C5">about 34 tok/s</tspan></text>
<text y="123" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">time to the first token, short prompt                   </tspan><tspan x="462.40" fill="#4FD1C5">0.32 s</tspan></text>
<text y="139" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">prefill, 128-token prompt                               </tspan><tspan x="462.40" fill="#4FD1C5">123 tok/s</tspan></text>
<text y="155" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">prefill, 512-token prompt                               </tspan><tspan x="462.40" fill="#4FD1C5">406 tok/s</tspan></text>
<text y="171" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">prefill, 1,024-token prompt                             </tspan><tspan x="462.40" fill="#4FD1C5">651 tok/s</tspan></text>
<text y="187" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">top-1 agreement with the fp32 CPU reference, 4 prompts  </tspan><tspan x="462.40" fill="#4FD1C5">0.979</tspan></text>
<text y="219" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#607D8B">36 Mamba-2 layers and 4 attention layers; one request at a time</tspan></text>
</svg>
