<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 257" width="682" height="257" role="img" aria-label="From the model card, one Blackhole chip: server ready 310 s after a cold start through tt-model serve and 32 s on a warm kernel cache; the first 10-second request after those starts took 121 s and 5.7 s; a repeated 10-second clip took 0.92 s twice and a 30-second clip 1.20, 1.25 and 1.85 s; waveform correlation with the recipe package 0.990 at 10 s and 0.983 at 30 s.">
