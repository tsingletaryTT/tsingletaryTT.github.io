<text y="171" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">10 s clip, repeated request, warm               </tspan><tspan x="399.77" fill="#4FD1C5">0.92 and 0.92 s     </tspan><tspan x="556.34" fill="#607D8B">measured, n=2</tspan></text>
