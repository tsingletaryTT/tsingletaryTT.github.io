<text y="107" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">server ready, cold kernel cache, tt-model serve </tspan><tspan x="399.77" fill="#4FD1C5">310 s               </tspan><tspan x="556.34" fill="#607D8B">measured, n=1</tspan></text>
<text y="123" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">first 10 s request after that start             </tspan><tspan x="399.77" fill="#4FD1C5">121 s               </tspan><tspan x="556.34" fill="#607D8B">measured, n=1</tspan></text>
<text y="139" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" xml:space="preserve"><tspan x="24.00" fill="#aaa">server ready, warm kernel cache                 </tspan><tspan x="399.77" fill="#4FD1C5">32 s                </tspan><tspan x="556.34" fill="#607D8B">measured, n=1</tspan></text>
