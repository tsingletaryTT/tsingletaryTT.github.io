title: Taylor Singletary
description: Developer Relations at Tenstorrent
url: "https://tsingletarytt.github.io"
baseurl: ""
author:
  name: Taylor Singletary
  github: tsingletaryTT
timezone: America/Los_Angeles
permalink: /writing/:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - docs/
  - vendor/
  # CLAUDE.md must stay excluded. jekyll-optional-front-matter turns every .md file into
  # a page and renders Liquid in it, and CLAUDE.md quotes Liquid tags while documenting the
  # local-preview trick. A fenced code block does NOT stop Liquid from parsing them, so
  # including this file fails the build with a for-loop syntax error.
  - CLAUDE.md
  - .claude/
