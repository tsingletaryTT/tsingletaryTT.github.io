- name: tt-orchard
  category: bringup
  lang: Python · agent harness · tt-gozer
  desc: >
    A local-only harness that brings a new Hugging Face model up on Blackhole hardware and
    stops at a review bundle for a person to read. Give it a model id and it reads the
    model's config and weight headers before it touches a chip, sorts it into a class
    (weights only, weights plus a sidecar, a vocabulary trim, a restricted head, a stock
    runtime, or a full port), writes and runs the tests, brings it up on the chips, checks the
    output against a CPU reference, and tries it on 1, 2 and 4 chips. The agents doing that
    work are open-source models served on the same QuietBox 2, so nothing calls out to a
    hosted model, and every chip is leased through tt-gozer. Each step goes into an
    append-only ledger, so a run can be paused, resumed, and recovered after a crash, and a
    control page on the box shows every run. The harness never publishes anything; its
    canning step builds the tt-model bundles. Cloudflare/clef went from one command to
    "ready for operator review" in about 3 hours of ledger time, and the clef, RAG-Gate,
    Hemmingway and OpenThai packages on this page are its output, as are the AREX-2 and
    MiniMax-Music3 bundles behind the two pages that use them. The microsite replays a real
    47-minute run from its own ledger.
  url: https://github.com/tsingletaryTT/tt-orchard
  site: https://tsingletarytt.github.io/tt-orchard/
  media: assets/img/projects/tt-orchard.webp
  media_kind: shot
  media_alt: >-
    The tt-orchard microsite hero: "A model lands on Hugging Face. Watch it come up." above a
    replay of a real bring-up of ProprietaryLegal/Qwen3.8-27B-CJK-Trim, with the orchardist's
    first log lines on the left and the nine stages, from intake to operator bundle, listed
    beside them.
  media_note: >-
    The project's microsite. The terminal is a replay of a real 47-minute run from its own
    ledger, and the panel beside it lists the nine stages, from intake to the operator bundle.

- name: tt-minimax-music-blackhole
  category: bringup
  lang: Python · Gradio · tt-model
  desc: >
    MiniMax-Music3 on one Blackhole chip: write lyrics, describe the music, get a song. A
    launcher and a Gradio page for the model with the fiona crapple language-model adapter
    merged into the weights, a rank-64 LoRA trained on nine tracks in one style that answers
    to its trigger phrase. The merged weights are on Hugging Face, and a tt-model thin bundle
    built by tt-orchard's canning step serves them. About 3.3 seconds of compute per second
    of audio, one song at a time, 32 kHz stereo. The launcher passes only the leased chips
    into the container, probes the image for a host problem that hangs the boot and applies
    the fix only when the probe shows it, and always stops the container. Over a hundred
