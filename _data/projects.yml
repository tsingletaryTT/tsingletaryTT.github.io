- name: tt-tnt
  lang: Python · ttml / tt-train
  desc: >
    A small Llama-3-style language model built Tenstorrent-first — trained from random
    initialization on Blackhole hardware with ttml, packaged with tt-kernel, and served
    through the Tenstorrent vLLM plugin. The point isn't capability; it's showing end to
    end, without gaps, what a model designed for Tenstorrent from the first line looks
    like when it's trained, published, and served entirely on Tenstorrent tooling.
    Weights and the corpus recipe are public on Hugging Face.
  url: https://github.com/tsingletaryTT/tt-tnt
  site: https://tsingletarytt.github.io/tt-tnt/
  media: assets/img/projects/tt-tnt-logo.webp
  media_kind: logo
  media_alt: >-
    tt-tnt's logo: a hand-drawn figure with TT-TNT lettered on its chest, standing on a grid of Tensix cores, SRAM and NoC routers, beside a hand-lettered "Tenstorrent".
  media_note: >-
    The project's own mark, drawn by hand rather than generated. The figure's skull is open at the back, and there is a die in it.

- name: tt-vjepa2
  lang: Python · TTNN
  desc: >
    A TTNN bring-up of Meta's V-JEPA 2-AC — a self-supervised video encoder plus an
    action-conditioned, frame-causal predictor — running end to end on Blackhole: the
    ViT-giant encoder's 40 blocks and the predictor's 24, at PCC 0.997 against the
    reference implementation. 120.7 ms per forward pass traced-replay, against 4.3
    seconds for the unmodified reference on the same machine's CPU. Ships a Gradio show
    that proves it works without ever generating a pixel: the model predicts embeddings,
    so a robot arm dances to a chained choreography of imagined rollouts, and a real port
    of Meta's CEM planner searches for the action that was actually taken.
  url: https://github.com/tsingletaryTT/tt-vjepa2
  site: https://tsingletarytt.github.io/tt-vjepa2/
  media: assets/img/projects/tt-vjepa2.webp
  media_kind: shot
  media_alt: >-
    The tt-vjepa2 microsite hero: "A world model that predicts what happens next — never
    what it looks like", over a dark teal gradient.
  media_note: >-
    The project's own microsite — the bring-up written up as a story, from the RoPE bug
    to the dancing arm.

