- name: tt-gozer
  category: tools
  lang: Python · stdlib only
  desc: >
    Cooperative chip leasing for Tenstorrent boxes, so several agents — Claude Code
    sessions, aider, shell scripts, cron jobs — can share one machine without corrupting
    each other's runs. A lease says who is using which chips and why; the kernel says
    whether that's actually true, and when the two disagree the kernel wins. Let go and
    let Gozer.
  url: https://github.com/tsingletaryTT/tt-gozer
  site: https://tsingletarytt.github.io/tt-gozer/
  media: assets/img/projects/tt-gozer.webp
  media_kind: shot
  media_alt: >-
    The Gozer Containment Log microsite: a green phosphor GOZER wordmark over a report
    header, and headline counts reading 7 entities on the line, 27 leases granted, 8 ghosts
    exorcised, 22.7 hours of containment time reclaimed.
  media_note: >-
    Its own containment log, generated from the lease ledger — 47 hours in which seven
    unrelated sessions took turns on two boards with nobody refereeing.

- name: tt-discolike
  category: tools
  lang: Python · FastAPI + htmx
  desc: >
    A local catalog and launcher for the one-off Gradio demos that pile up around scarce
    hardware. Tenstorrent chips are contended, so demos get built, shown once, and
    forgotten — there's no way to bring one back up later. Any repo joins the catalog by
    committing a small manifest; the page starts and stops each app as a systemd --user
    unit and hands off to gozer for chip leasing when it's installed. Named after Disco,
    the self-hosted PaaS, but deliberately not built on it: Docker Swarm's execution
    model fights chip passthrough, and gozer tracks leases by host PID.
  url: https://github.com/tsingletaryTT/tt-discolike
  media: assets/img/projects/tt-discolike.webp
  media_kind: shot
  media_alt: >-
    The tt-discolike catalog page: animatediff and vjepa2 as cards, each with an INACTIVE
