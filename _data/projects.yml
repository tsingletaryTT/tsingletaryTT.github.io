- name: tt-animatediff
  lang: Python · TTNN
  desc: >
    AnimateDiff on Blackhole, in three phases: temporally coherent video on CPU with the full
    MotionAdapter, then spatial denoising accelerated by the TTNN UNet, then MotionAdapter
    temporal attention injected directly into the Blackhole denoising loop — no distillation,
    weights loaded straight from the upstream adapter. Eight frames at 25 steps, about 15
    seconds a frame.
  url: https://github.com/tenstorrent/tt-animatediff
