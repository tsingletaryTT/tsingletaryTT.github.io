- name: tt-waypoint
  category: bringup
  lang: Python · TTNN
  desc: >
    A from-scratch TTNN bring-up of Overworld/Waypoint-1.5-1B, a custom autoregressive
    causal diffusion transformer — a "world model" generating interactive video
    conditioned on keyboard/mouse input, one full frame per step against a per-layer
    ring-buffer cache of previous frames rather than a token-by-token KV cache. Unlike
    tt-skyreels' reused transformer, nothing in tt-metal's model library already
    covers this shape, so the attention/cache scheme, conditioning heads, and CNN VAE
    were all ported and hardware-verified from scratch against the real HF reference.
    Now packaged on Hugging Face as a session-based HTTP API on one chip: seed it with an
    image and step it forward a frame at a time with mouse and scroll input. Frames are
    coherent, and it runs about 1,400x below real time with no performance work done yet.
    The timestamped log of every stage and bug is public in the repo.
  url: https://github.com/tsingletaryTT/tt-waypoint
  links:
    - label: Package on Hugging Face
