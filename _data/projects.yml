- name: tt-orchard
  category: bringup
  lang: Python · agent harness · tt-gozer
  desc: >
    A local-only harness that brings a new Hugging Face model up on Blackhole hardware and
    stops at a review bundle for a person to read. Give it a model id and it downloads the
    weights, sorts the model into a class (weights only, weights plus a sidecar, or a full
    port), writes and runs the tests, brings it up on the chips, checks the output against a
    CPU reference, and tries it on 1, 2 and 4 chips. The agents doing that work are open-source
    models served on the same QuietBox 2, so nothing calls out to a hosted model, and every chip
    is leased through tt-gozer. Each step goes into an append-only ledger, so a run can be
    paused, resumed, and recovered after a crash. The harness never publishes anything.
    Cloudflare/clef went from one command to "ready for operator review" in about 3 hours of
    ledger time; the clef, RAG-Gate, Hemmingway and OpenThai packages below are its output.
  url: https://github.com/tsingletaryTT/tt-orchard
  media: assets/img/projects/tt-orchard.svg
  media_kind: card
  media_alt: >-
    tt-orchard's run log as shown in its README: timestamped lines from the orchardist
    supervisor, the grafter coder agent and the sheepdog watchdog, through a stage 2 hardware
    test that failed with exit 4. The agent was not asked to retry; the stage was handed
    to the next tier.
  media_note: >-
    What a run prints, from the README. The orchardist (the supervisor), the grafter (the
    coder) and the sheepdog (the watchdog) each log what they did and when. Here a stage 2
    hardware test fails. The agent is not asked to retry; the stage is handed to the next
    tier.

