- name: audio8-asr-infinite-p150
  category: bringup
  lang: tt-model-manager 5.1 container · TTNN · Blackhole p150
  desc: >
    Streaming English speech recognition on one Blackhole chip: Edge0's Audio8-ASR-Infinite,
    a Voxtral-style audio encoder feeding a Qwen2.5-3B-class decoder, served as an HTTP
    file-transcription endpoint and a WebSocket stream that takes 16 kHz PCM and returns text
    deltas. The 32-layer causal audio encoder, the projector and the 36-layer decoder all run
    on the chip, with a 30-second rolling context so a stream can run for any length. Word
    error rate on 73 LibriSpeech validation utterances was 7.30% sent one at a time and 5.22%
    as one continuous stream, and on the first 39 utterances the port matches the CPU
    reference exactly at 5.47%. First text arrives about 1.3 seconds after speech starts.
    Beta, built from a local tt-metal branch, and the card says so.
  url: https://huggingface.co/episod/audio8-asr-infinite-p150
  media: assets/img/projects/audio8-asr-infinite-p150.svg
  media_kind: card
  media_alt: >-
    From the model card: word error rate on 73 LibriSpeech validation utterances was 7.30%
    sent separately and 5.22% as one continuous 8.6-minute stream; on the first 39
    utterances the CPU reference and this port both score 5.47%. First text 1.3 seconds
    after the stream starts, real time factor 0.66 to 0.68.
  media_note: >-
    The card's expected-performance block. The normalizer merges neither digits nor spelling
    variants, so the card calls its own figures pessimistic.

