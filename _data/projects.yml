- name: tt-tnt
  lang: Python · ttml / tt-train
  desc: >
    A small Llama-3-style language model built Tenstorrent-first — trained from random
    initialization on Blackhole hardware with ttml, packaged with tt-kernel, and served
    through the Tenstorrent vLLM plugin. The point isn't capability; it's showing end to
    end, without gaps, what a model designed for Tenstorrent from the first line looks
    like when it's trained, published, and served entirely on Tenstorrent tooling.
    Weights and the corpus recipe are public on Hugging Face.
  url: https://github.com/tsingletaryTT/tt-tnt
  site: https://tsingletarytt.github.io/tt-tnt/

- name: tt-bio-demo
  lang: Python · GTK4 + OpenGL
  desc: >
    A turnkey conference demo built on top of moritztng/tt-bio — the project that brings
    protein structure prediction to Tenstorrent hardware, running Boltz-2 and friends on
    Blackhole. This is the booth wrapped around it: watch a protein condense out of noise
    into its folded structure in real time, on the chips a few feet away. Four chips fold
    four molecules at once in a quad view, streaming the model's actual denoising
    trajectory a step at a time. Built to run unattended on a show floor all day.
  url: https://github.com/tsingletaryTT/tt-bio-demo
  site: https://tsingletarytt.github.io/tt-bio-demo/

- name: tt-gozer
  lang: Python · stdlib only
  desc: >
    Cooperative chip leasing for Tenstorrent boxes, so several agents — Claude Code
    sessions, aider, shell scripts, cron jobs — can share one machine without corrupting
    each other's runs. A lease says who is using which chips and why; the kernel says
    whether that's actually true, and when the two disagree the kernel wins. Let go and
    let Gozer.
  url: https://github.com/tsingletaryTT/tt-gozer

- name: tt-demo-maker
  lang: Rust · tmux + asciinema
  desc: >
    A project-agnostic toolkit for authoring demo recordings and draft posts from inside
    any project. Point it at a TUI or CLI, describe the scenes in YAML, and it produces
    recorded footage (asciicast, GIF, MP4) alongside a first-draft Markdown post pairing
    each directive with the reaction it caused — so the recording machinery isn't
    reinvented per project.
  url: https://github.com/tsingletaryTT/tt-demo-maker

- name: tt-midi-maker
  lang: Python · MCP server
  desc: >
    Multi-track MIDI generation from text prompts, running on Tenstorrent hardware.
    Exposes generation as a fully-featured MCP server — meaning any MCP-compatible
    client can compose music through it.
  url: https://github.com/tsingletaryTT/tt-midi-maker
  site: https://tsingletarytt.github.io/tt-midi-maker/

- name: tt-zork-and-more
  lang: Python · C++ · TT-Lang
  desc: >
    Zork I (and II, III, Hitchhiker's, Planetfall, Colossal Cave) running on a Blackhole
    accelerator across three hardware stages: a host-CPU Z-machine, the same interpreter
    with the game binary living in Blackhole DRAM, and finally a Z-machine kernel executing
    on the chip's RISC-V management cores. An optional remix layer has Llama-3.3-70B on
    Tensix rewrite every response as you play. 1977 interactive fiction as a way to explore
    what's actually programmable on the silicon.
  url: https://github.com/tsingletaryTT/tt-zork-and-more
  site: https://tsingletarytt.github.io/tt-zork-and-more/

- name: tt-station
  lang: Rust · Swift · macOS
  desc: >
    Use your Tenstorrent hardware from a Mac with ease — a native bridge between
    macOS and TT accelerators. "Such is the stuff, from where dreams are woven."
  url: https://github.com/tsingletaryTT/tt-station
  site: https://tsingletarytt.github.io/tt-station/

- name: tensix-viz
  lang: JavaScript
  desc: >
    Hardware topology visualizer — from individual Tensix chips up to full
    multi-chip clusters. Makes the physical architecture of Tenstorrent hardware
    legible at a glance.
  url: https://github.com/tsingletaryTT/tensix-viz
  site: https://tsingletarytt.github.io/tensix-viz/

- name: tt-forge-compiletron
  lang: Python
  desc: >
    Compile more than 100 models on tt-forge and display the results in a format
    built for demos. A fast way to show off the breadth of the Tenstorrent software stack.
  url: https://github.com/tsingletaryTT/tt-forge-compiletron
  site: https://tsingletarytt.github.io/tt-forge-compiletron/

- name: tt-warp
  lang: Python · Warp plugin
  desc: >
    A Warp terminal plugin for Tenstorrent — hardware status, model runner
    shortcuts, and workflow automation built into the terminal experience.
  url: https://github.com/tsingletaryTT/tt-warp

- name: tt-model-runner
  lang: Python · GUI + TUI
  desc: >
    Discover, load, and benchmark models with a GUI and a TUI for
    tt-inference-server. The friendly face on top of raw hardware inference.
  url: https://github.com/tsingletaryTT/tt-model-runner

- name: tt-qb-lights
  lang: Rust
  desc: >
    Sync your Quietbox's LED lighting to the live status of its accelerator chips.
    Real-time visual feedback from the hardware, written in Rust.
  url: https://github.com/tsingletaryTT/tt-qb-lights

- name: tt-developer-image
  lang: Dockerfile
  desc: >
    A developer-focused container image for Tenstorrent work. Batteries included:
    the full stack, tooling, and a development experience worth having.
  url: https://github.com/tsingletaryTT/tt-developer-image

- name: tt-claw
  lang: Shell
  desc: >
    Allow the claw machine to reward you with experience. A playful hardware
    integration that turns physical arcade interaction into something meaningful.
  url: https://github.com/tsingletaryTT/tt-claw

- name: tt-agents
  lang: Python
  desc: >
    Six local-agent demos that run entirely on a Tenstorrent QuietBox 2 — no cloud,
    no API keys: a web-research agent, a codebase explorer, a multi-agent writing
    pipeline, a stateful dungeon master, and storyboard-to-pixelart and landscape-SVG
    generative pipelines. A working argument that 32B+ models make agentic tool-calling
    reliable where 7B models fall apart.
  url: https://github.com/tsingletaryTT/tt-agents

- name: tt-lang-freeciv
  lang: C
  desc: >
    Defer FreeCiv AI and generative work to Tenstorrent hardware via TT-Lang-based
    kernels. An experiment in offloading game intelligence to real accelerator silicon.
  url: https://github.com/tsingletaryTT/tt-lang-freeciv
