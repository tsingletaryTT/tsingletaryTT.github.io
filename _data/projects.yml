- name: tt-zork-and-more
  lang: Python · C++ · TT-Lang
  desc: >
    Zork I (and II, III, Hitchhiker's, Planetfall, Colossal Cave) running on a Blackhole
    accelerator across three hardware stages: a host-CPU Z-machine, the same interpreter
    with the game binary living in Blackhole DRAM, and finally a Z-machine kernel executing
    on the chip's RISC-V management cores. An optional remix layer has Llama-3.3-70B on
    Tensix rewrite every response as you play. 1977 interactive fiction as a way to explore
    what's actually programmable on the silicon.
  url: https://github.com/tsingletaryTT/tt-zork-and-more
  site: https://tsingletarytt.github.io/tt-zork-and-more/
  media: assets/img/projects/tt-zork-and-more.mp4
  poster: assets/img/projects/tt-zork-and-more.webp
  media_kind: clip
  media_alt: >-
    Zork session in a terminal where each stock game response is replaced by a longer rewritten passage.
  media_note: >-
    Hybrid mode: a human plays, Llama-3.3-70B on Tensix rewrites every response the game gives back.

