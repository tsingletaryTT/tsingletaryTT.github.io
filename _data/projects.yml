- name: tt-skyreels
  category: bringup
  lang: Python · TTNN
  desc: >
    SkyReels-V2-DF-1.3B-540P text-to-video on Blackhole, packaged as a
    tt-model-manager v5.1 container — pull it with Docker and a TT card, no host
    tt-metal install required. The transformer is weight-compatible with tt-metal's
    own WanTransformer3DModel, so this repo reuses that TTNN model wholesale rather
    than shipping new kernels; what it adds is the serving glue, an ASGI app wrapping
    the pipeline behind an HTTP surface, plus the fixes needed to run a real
    generation end to end. 48 CPU-only tests need no card to run.
  url: https://github.com/tsingletaryTT/tt-skyreels
