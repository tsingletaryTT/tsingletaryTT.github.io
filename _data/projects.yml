- name: tt-toplike
  category: tools
  lang: Rust
  desc: >
    Real-time hardware monitoring for Grayskull, Wormhole and Blackhole silicon — top(1) if it
    had been designed to be looked at. The visualizations aren't decorative: every particle,
    star and colour shift maps to a real signal off the chip, read from the driver's sysfs
    attributes (power, die temperature, current, three clock domains, DDR training state, ECC
    counters, PCIe throughput, the ARC firmware heartbeat). An adaptive baseline learns your
    chip's idle state, so a 20 W card and an 80 W card read the same at the same fraction above
    idle.
  url: https://github.com/tenstorrent/tt-toplike
  site: https://docs.tenstorrent.com/tt-toplike/
  media: assets/img/projects/tt-toplike.mp4
  poster: assets/img/projects/tt-toplike.webp
  media_kind: clip
  media_alt: >-
    Arcade mode: a starfield of Tensix cores, a Memory Castle panel and a memory-flow lane, all
    pulsing in colour across four Blackhole chips under load.
  media_note: >-
    Arcade mode, four Blackhole chips under LLM inference. Hue tracks temperature, drifts with
    time, and offsets per core — so the grid shows a wave instead of flipping all at once.

