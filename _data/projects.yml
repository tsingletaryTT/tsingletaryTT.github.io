- name: tt-openvla
  category: bringup
  lang: Python · TTNN
  desc: >
    A TTNN bring-up of OpenVLA — a fused DINOv2 + SigLIP vision backbone driving a
    LLaMA-2-7B language model, fine-tuned on the Open X-Embodiment dataset to predict
    robot manipulation actions. Given an image and a natural-language instruction, it
    generates a 7-DoF end-effector action autoregressively, as extra tokens appended to
    the tokenizer's vocabulary and decoded back to continuous values. Every stage
    validated end to end against real checkpoint weights at ≥0.995 PCC, vision through
    all 32 LLaMA-2-7B layers to decoded action, on a real 2-device mesh. Reuses
    tt-vjepa2's Gradio backend pattern rather than its architecture — the two share no
    weights or code, only the bring-up conventions.
