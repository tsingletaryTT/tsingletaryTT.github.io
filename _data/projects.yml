- name: tt-vscode-toolkit
  lang: TypeScript · Python · VS Code extension
  desc: >
    A complete learning and development environment for Tenstorrent hardware, shipped on the
    VS Code Marketplace: 53 interactive lessons from hardware detection through custom
    training, click-to-run commands instead of copy-paste, production-ready templates, live
    device telemetry in the status bar, and hardware auto-detection that tailors the guidance
    to whatever accelerator you actually have. Covers vLLM, TT-Forge, TT-XLA and TT-Metalium.
  url: https://github.com/tenstorrent/tt-vscode-toolkit
  site: https://docs.tenstorrent.com/tt-vscode-toolkit/
