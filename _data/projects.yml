- name: tt-cv-agency
  category: applied
  lang: Python · TTNN · VCV Rack
  desc: >
    A model running on Tenstorrent hardware placed inside a synthesizer's control loop:
    listen to the live audio, decide a control-voltage adjustment toward a goal, write it
    back, repeat. A small inverse-regression model trained on CV sweeps against a live
    patch runs its forward pass on a Blackhole chip via ttnn, and the CV backend is kept
    behind an interface so the same loop should carry over from VCV Rack to real Eurorack
    through Expert Sleepers hardware. Work in progress, and the write-up says so: one of
    three target features converges reliably, and a review that caught the pitch estimator
    silently returning a clipped constant is why the other two are honestly reported rather
    than quietly dropped.
