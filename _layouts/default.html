<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="wordmark">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/#work' | relative_url }}">work</a>
        <a href="{{ '/writing' | relative_url }}">writing</a>
        <a href="{{ '/#about' | relative_url }}">about</a>
      </div>
    </nav>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer" id="about">
      <div class="footer-left">
        <a href="https://github.com/tsingletaryTT">github.com/tsingletaryTT</a><br>
        <a href="http://realitytechnicians.com">realitytechnicians.com</a>
        <div class="footer-episod">also <a href="https://github.com/episod">github.com/episod</a></div>
      </div>
    </footer>
  </div>
</body>
</html>
